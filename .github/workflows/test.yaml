name: test
on:
  push:
    branches: [master, v1-security]
  pull_request:
    branches: [master, v1-security]

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        go-version: [1.20.14, 1.26.9, 1.27.2]
    name: Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache: false
      - name: Install libpcsc
        run: sudo apt-get update && sudo apt-get install -y libpcsclite-dev
      - name: Test and vet
        run: |
          go test -race -count=1 ./...
          go vet ./...
  build-windows:
    strategy:
      matrix:
        go-version: [1.20.14, 1.26.9, 1.27.2]
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache: false
      - name: Build
        run: go build ./...
        env:
          CGO_ENABLED: 0
